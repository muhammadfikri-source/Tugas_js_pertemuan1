<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Menghitung Luas Bangun Datar</title>
</head>
<body>
  
  <font color="red"  widt="50px"><marquee behavior="alternate" direction="">Tugas js pertemuan1_Muhammad fikri dwi saputra_universitas Muhammadiyah jakarta</marquee></font> 

  <script>
    
    // Luas Persegi Panjang
    // Rumus: panjang × lebar
    
    let panjang = 10; // nilai panjang 
    let lebar = 5;    // nilai lebar bebas
    let luasPersegiPanjang = panjang * lebar;
    document.write("Luas Persegi Panjang = " + luasPersegiPanjang);
    document.write("<br>");

    
    // Luas Bujur Sangkar (Persegi)
    // Rumus: sisi × sisi
    
    let sisi = 8; // nilai sisi 
    let luasPersegi = sisi * sisi;
    document.write("Luas Persegi (Bujur Sangkar) = " + luasPersegi);
document.write("<br>");

    
    // Luas Segitiga
    // Rumus: 1/2 × alas × tinggi
    
    let alas = 12;   // nilai alas 
    let tinggi = 6;  // nilai tinggi 
    let luasSegitiga = 0.5 * alas * tinggi;
    document.write("Luas Segitiga = " + luasSegitiga);
  </script>
</body>
</html>
